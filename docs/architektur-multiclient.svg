<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#111">
  <defs>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1040" height="880" fill="#f4f2ee"/>

  <!-- Titel -->
  <text x="24" y="38" font-size="22" font-weight="700">EDC Sticky – Architektur: heute und mit Multiclient</text>
  <text x="24" y="60" font-size="13" fill="#555">Stand 15.11.2026 · Leitbild bleibt: Sticky = dünnes Terminal, App = Zwilling und Gehirn · /soll schreibt nur die App, /ist nur der Sticky</text>
  <line x1="24" y1="72" x2="1016" y2="72" stroke="#111" stroke-width="2"/>

  <!-- ================= HEUTE ================= -->
  <text x="24" y="100" font-size="15" font-weight="700">HEUTE · ein Sticky</text>

  <rect x="24" y="112" width="300" height="250" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="134" font-weight="700">Fold-App (Capacitor)</text>
  <rect x="38" y="146" width="272" height="56" fill="#f4f2ee" stroke="#999"/>
  <text x="48" y="166" font-weight="700">ein Zwilling</text>
  <text x="48" y="184" fill="#444">Soll = globale Einträge im Speicher:</text>
  <text x="48" y="198" fill="#444" font-size="11">sticky.karussell · lagen · zettel · spickzettel …</text>
  <rect x="38" y="210" width="272" height="44" fill="#f4f2ee" stroke="#999"/>
  <text x="48" y="230" font-weight="700">Verbindung</text>
  <text x="48" y="246" fill="#444" font-size="12">genau ein gemerkter Sticky (sticky.geraet)</text>
  <rect x="38" y="262" width="272" height="44" fill="#f4f2ee" stroke="#999"/>
  <text x="48" y="282" font-weight="700">StickyDienst (Android)</text>
  <text x="48" y="298" fill="#444" font-size="12">ein BLE-Wecker, GPS, Wachhalten</text>
  <rect x="38" y="314" width="272" height="36" fill="#f4f2ee" stroke="#999"/>
  <text x="48" y="337" font-weight="700">Abgleich</text>
  <text x="120" y="337" fill="#444" font-size="12">Soll → /soll · /ist → App</text>

  <line x1="324" y1="237" x2="404" y2="237" stroke="#111" stroke-width="2" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="340" y="228" font-size="12">BLE</text>

  <rect x="406" y="168" width="150" height="138" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="418" y="190" font-weight="700">Sticky A</text>
  <text x="418" y="207" fill="#555" font-size="11">Bastel-Gerät …55:9c</text>
  <line x1="418" y1="216" x2="544" y2="216" stroke="#ccc"/>
  <text x="418" y="236" font-size="12">Firmware 0.31</text>
  <text x="418" y="254" font-size="12">SD: /soll  /ist</text>
  <text x="418" y="272" font-size="12">stand.txt je Ordner</text>
  <text x="418" y="290" font-size="12" fill="#555">offline nutzbar</text>

  <!-- Schwachstellen heute -->
  <rect x="24" y="378" width="532" height="100" fill="#fff" stroke="#b33" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="38" y="400" font-weight="700" fill="#b33">Wo es heute klemmt</text>
  <text x="38" y="420" font-size="12">• zweiter Sticky = „gemerkten“ überschreiben, Einstellungen gelten für beide</text>
  <text x="38" y="438" font-size="12">• frisch aus dem Playground: leer, bis die App alles aufspielt</text>
  <text x="38" y="456" font-size="12">• Ist-Daten (Diktate, Fahrten, Notizen) tragen keine Gerätekennung</text>
  <text x="38" y="472" font-size="12">• Abgleich läuft nicht mehr komplett (Home/Menü fehlt) – erst klären</text>

  <!-- ================= ZIEL ================= -->
  <line x1="584" y1="88" x2="584" y2="660" stroke="#bbb" stroke-width="1"/>
  <text x="604" y="100" font-size="15" font-weight="700">ZIEL · Multiclient</text>

  <rect x="604" y="112" width="412" height="330" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="618" y="134" font-weight="700">Fold-App</text>

  <rect x="618" y="146" width="384" height="40" fill="#e9e4d8" stroke="#999"/>
  <text x="628" y="164" font-weight="700">Geräteliste</text>
  <text x="628" y="179" fill="#444" font-size="12">Name · MAC · Besitzer · Profil · Schlüssel · zuletzt gesehen</text>

  <rect x="618" y="194" width="384" height="40" fill="#e9e4d8" stroke="#999"/>
  <text x="628" y="212" font-weight="700">Bibliothek (geteilt)</text>
  <text x="628" y="227" fill="#444" font-size="12">Widgets · Strichschrift · Hilfe · Profil-Vorlagen (nichts Persönliches)</text>

  <rect x="618" y="242" width="186" height="96" fill="#f4f2ee" stroke="#999"/>
  <text x="628" y="262" font-weight="700">Zwilling A</text>
  <text x="628" y="280" font-size="12">Soll: Profil „EDC“</text>
  <text x="628" y="296" font-size="11" fill="#444">Karussell, Zettel, Spickzettel, Wörterbuch</text>
  <text x="628" y="314" font-size="12">Ist: Zustand, Akku,</text>
  <text x="628" y="329" font-size="12">Bestandslisten</text>
  <rect x="816" y="242" width="186" height="96" fill="#f4f2ee" stroke="#999"/>
  <text x="826" y="262" font-weight="700">Zwilling B</text>
  <text x="826" y="280" font-size="12">Soll: Profil „Test/Wand“</text>
  <text x="826" y="296" font-size="11" fill="#444">eigenes Karussell, eigene Lage</text>
  <text x="826" y="314" font-size="12">Ist: Zustand, Akku,</text>
  <text x="826" y="329" font-size="12">Bestandslisten</text>

  <rect x="618" y="346" width="384" height="40" fill="#e9e4d8" stroke="#999"/>
  <text x="628" y="364" font-weight="700">Verbindungsverwalter + StickyDienst</text>
  <text x="628" y="379" fill="#444" font-size="12">eine Verbindung je Gerät, Wecker je MAC, Abgleich je Gerät</text>

  <rect x="618" y="394" width="384" height="38" fill="#e9e4d8" stroke="#999"/>
  <text x="628" y="412" font-weight="700">Ablage</text>
  <text x="680" y="412" fill="#444" font-size="12">Ist-Daten mit Gerätekennung (Diktat, Fahrt, Notiz)</text>
  <text x="628" y="426" fill="#444" font-size="11">Bordbuch und Notizen bleiben zentral, nur die Quelle ist markiert</text>

  <!-- Pfeile zu den Geräten -->
  <line x1="711" y1="442" x2="680" y2="514" stroke="#111" stroke-width="2" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <line x1="909" y1="442" x2="868" y2="514" stroke="#111" stroke-width="2" marker-start="url(#pf)" marker-end="url(#pf)"/>
  <text x="704" y="486" font-size="12">BLE</text>
  <text x="900" y="486" font-size="12">BLE</text>

  <rect x="604" y="516" width="150" height="86" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="616" y="538" font-weight="700">Sticky A</text>
  <text x="616" y="555" fill="#555" font-size="11">…55:9c · Microlino/EDC</text>
  <text x="616" y="575" font-size="12">gleiche Firmware</text>
  <text x="616" y="592" font-size="12">SD: /soll  /ist</text>

  <rect x="790" y="516" width="150" height="86" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="802" y="538" font-weight="700">Sticky B</text>
  <text x="802" y="555" fill="#555" font-size="11">…56:94 · Testgerät</text>
  <text x="802" y="575" font-size="12">gleiche Firmware</text>
  <text x="802" y="592" font-size="12">SD: /soll  /ist</text>

  <rect x="960" y="516" width="56" height="86" fill="none" stroke="#999" stroke-dasharray="4 3"/>
  <text x="988" y="555" text-anchor="middle" fill="#888" font-size="12">C …</text>
  <text x="988" y="572" text-anchor="middle" fill="#888" font-size="10">später</text>

  <text x="604" y="628" font-size="12" font-weight="700">Kernpunkt: reine App-Arbeit, Firmware und Protokoll bleiben.</text>
  <text x="604" y="646" font-size="12" fill="#444">Jeder Sticky kennt nur sein eigenes /soll; die App hält je Gerät ein Profil.</text>

  <!-- Entschieden -->
  <rect x="24" y="500" width="532" height="160" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="38" y="522" font-weight="700">Entschieden (Markus, 15.11.2026)</text>
  <text x="38" y="544" font-size="12">1. Alle Stickys gleichzeitig verbunden, reihum nur als Rückfall</text>
  <text x="38" y="564" font-size="12">2. Bibliothek geteilt (nur Unpersönliches), Profil je Gerät</text>
  <text x="38" y="584" font-size="12">3. Profile sind Vorlagen („EDC“, „Einfach“, „Wand“), mehrfach nutzbar</text>
  <text x="38" y="604" font-size="12">4. Bisherige Daten gehören automatisch zu Sticky A</text>
  <text x="38" y="630" font-size="12" fill="#444">Zuerst: beide Stickys für Markus selbst.</text>
  <text x="38" y="646" font-size="12" fill="#444">Familie (z. B. Einfach-Profil) von Anfang an mitdenken.</text>

  <!-- Familie und Privatsphäre -->
  <rect x="24" y="676" width="992" height="184" fill="#fff" stroke="#2a5d8f" stroke-width="1.5"/>
  <text x="38" y="698" font-weight="700" fill="#2a5d8f">Familie und Privatsphäre (mitdenken, nicht sofort bauen)</text>
  <text x="38" y="722" font-size="12">• <tspan font-weight="700">Besitzer je Gerät:</tspan> Diktate, Notizen, Fahrten und Zettel gehören einer Person und gehen nie auf ein fremdes Gerät.</text>
  <text x="38" y="742" font-size="12">• <tspan font-weight="700">Bibliothek = nur Unpersönliches</tspan> (Widgets, Schrift, Hilfe). Spickzettel und Wörterbuch gehören zum Profil, nicht zur Bibliothek.</text>
  <text x="38" y="762" font-size="12">• <tspan font-weight="700">Sparsam bei fremden Geräten:</tspan> von einem Familien-Sticky holt die App nur, was der Zweck braucht (z. B. „Erledigt“), keine Diktate.</text>
  <text x="38" y="782" font-size="12">• <tspan font-weight="700">„Gerät vergessen“:</tspan> löscht seine Daten in der App und leert /ist und /soll auf dem Sticky – Pflicht vor dem Verschenken.</text>
  <text x="38" y="802" font-size="12">• <tspan font-weight="700">Alles bleibt lokal</tspan> (Handy, SD-Karte, Heimnetz), keine Cloud. Fernpflege für Angehörige ist ein eigenes Thema (Einfach-Profil).</text>
  <text x="38" y="826" font-size="12" fill="#b33">• <tspan font-weight="700">Lücke heute:</tspan> BLE ohne Kopplung – jedes Handy in Funkreichweite könnte /ist lesen und /soll schreiben.</text>
  <text x="52" y="844" font-size="12" fill="#b33">Vorschlag: Kopplung mit Bestätigung am Sticky (Taste), danach nur verschlüsselt. Einzige Firmware-Änderung, eigener Schritt.</text>
</svg>
